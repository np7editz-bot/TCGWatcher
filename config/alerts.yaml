# Alert rules. Evaluated daily after build. Each alert has a stable key; an alert is sent once per
# "episode" (e.g. a ratio alert is sent when a set crosses the threshold and again only after it dropped below).
buy:
  threshold: 0.80          # buy signal when EV€ of hits (excl. ★★) ÷ best EU buy price ≥ this
  rearm_improvement: 0.10  # alert again within an episode when the best price drops ≥10%
  near: 0.70               # retail restock/pre-order messages only for sets with ratio ≥ this (or unreleased sets)
eu_landed:                 # what a CardTrader box really costs you (listing price excludes shipping/fees)
  zero_fee_eur: 6          # CardTrader Zero: one fixed fee per order (hub shipping + service)
  seller_shipping_eur: 15  # non-Zero seller ships himself: typical sealed-box shipping within the EU (seen €10–36)
slabs:                     # eBay graded copies (EBAY_DE/EBAY_NL, incl. shipping to NL) vs raw TCGplayer market in €
  max_vs_raw: 1.15         # 🏆 SLAB-KOOP when the cheapest PSA/BGS/CGC 10 (else 9.5, 9) costs ≤ 1.15 × raw
  min_raw_eur: 50
  grades: [10, 9.5, 9]
grading:                   # 📈 GRADE-KANS: buy raw, grade, sell graded (asks as proxy for sales)
  gem_rate: 0.40           # share of raw copies that come back PSA 10 (conservative for modern foil alt-arts)
  grading_cost_eur: 25     # PSA bulk via EU submitter incl. shipping
  fee_pct: 13              # eBay final value fee + payment
  min_psa10_n: 3           # liquidity: at least 3 PSA 10 listings
  min_profit_eur: 50       # expected net per card
  min_roi: 0.5             # net ÷ raw price
briefing: weekly           # daily | weekly (Sunday) | off
ratio:
  threshold: 0.60          # legacy US ratio (page only; no longer alerts)
  include_saa: false
box_price:
  drop_pct_7d: -10         # box market price vs 7-day average
  rise_pct_7d: 10
card_price:
  move_pct_7d: 25          # single chase card
  min_price_usd: 20
new_group: true            # new set/product line appears in TCGCSV (presale = earliest pre-order signal)
new_sealed_product: true   # new booster box / case / pack product appears in an existing group
quality_issues: fail_only   # true = also warn-changes; fail_only = only when the page was not updated
exclude_flags: [manga, story, low_coverage, no_cards]   # sets with these flags never trigger ratio alerts
