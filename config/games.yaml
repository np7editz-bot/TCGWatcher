# TCGWatcher game configuration.
# Adding a game = adding a block here. The pipeline (fetch → validate → build → alerts) is game-agnostic.
#
# Prices come from TCGplayer via tcgcsv.com (one snapshot per day). All prices are USD; the build converts to EUR.
# Scope: English-market products only (TCGplayer lists EN product).

games:
  dbfw:
    name: "Dragon Ball Super Card Game: Fusion World"
    short: "Fusion World"
    tcgcsv_category: 80
    cardtrader_game: "dragon ball"    # substring of the CardTrader game name(s); expansions by SETCODE (FB/SB/ST/FS/…)
    cardmarket_game_id: 13            # Cardmarket public price guide (game 13 = Dragon Ball Super incl. Fusion World)
    cardmarket_slug: DragonBallSuper  # URL path segment on cardmarket.com
    enabled: true
    score: true                      # compute Chase Score for booster sets
    eu_sources: true                 # CardTrader (EU box/card asks, graded) + eBay (slabs, raw) are joined for this game
    alerts: true                     # Telegram KOOP/SLAB messages; false = silent (page + paper portfolio only)
    ebay_sets: 12                    # most recent booster sets that get eBay slab/raw searches
    # Which groups (TCGplayer "groups" = sets/products lines) are booster sets, starter decks, or promo lines.
    # Matched against the group abbreviation.
    group_kinds:
      booster: '^(FB|SB|ST)\d{2}$'
      starter: '^FS\d{2}$'
      promo:   '_(PR|AR|RE|EM|TPR)$|^DBSFW_'
    box:
      packs: 24
      cards_per_pack: 12
      case_boxes: 12
    # Per-set overrides (keyed by abbreviation). Flags are shown on the page and exclude a set from alerts when noted.
    set_overrides:
      ST01: { packs: 20, flags: [story], note: "Story Booster: 20 packs, all-foil; estimates not calibrated" }
      SB01: { flags: [manga], note: "Manga Booster: different pack structure; estimates not calibrated" }
      SB02: { flags: [manga], note: "Manga Booster: different pack structure; estimates not calibrated" }
    # Sealed product detection inside a group (products without a card Number).
    sealed:
      box:  { endswith: "Booster Box", not_contains: ["Case"] }
      case: { endswith: "Booster Box Case" }
      pack: { endswith: "Booster Pack", not_contains: ["Sleeved"] }
    # Hit classes. Rules are evaluated top-down; first match wins. A card with no match is "base" (not a hit).
    # est = expected number per box (24 packs). Source: community openings (FB10, ~120 packs); low confidence.
    classes:
      - id: SAA
        label: "Super alt-art (★★)"
        rule: { name_contains: "(Super Alternate Art)" }
        est: 0.08
        lottery: true
        note: "~1 per 12-box case; community estimate"
      - id: SCR_AA
        label: "SCR alt-art (★)"
        rule: { rarity: "Secret Rare", name_contains: "(Alternate Art)" }
        est: 0.15
      - id: SCR_AA
        label: "SCR alt-art (★)"
        rule: { rarity: "Leader", name_contains: "(Gold)" }   # Manga Booster gold leaders, SCR★-tier chase
        est: 0.15
      - id: SCR
        label: "Secret Rare"
        rule: { rarity: "Secret Rare" }
        est: 0.60
      - id: SR_AA
        label: "SR alt-art"
        rule: { rarity: "Super Rare", name_contains: "(Alternate Art)" }
        est: 1.5
        note: "~6% per pack"
      - id: SR
        label: "Super Rare"
        rule: { rarity: "Super Rare" }
        est: 5.5
        note: "~23% per pack"
      - id: OTHER_AA
        label: "Other alt-arts (L/R/UC)"
        rule: { rarity_in: ["Leader", "Rare", "Uncommon", "Common"], name_contains: "(Alternate Art)" }
        est: 1.0
        note: "no sampled rate; assumption"
    # Canonical card key: GAME:SET:NUMBER:VARIANT. Variant is derived from the name suffix.
    # Known TCGplayer catalogue errors, corrected on load (productId → right Number). Raw data stays as fetched.
    number_fixes:
      693131: "FB10-067"     # 'Piccolo - FB10-067' carries Number FB10-068 in the source (2026-10)
      707458: "FB10-067"     # same card, Limited Pack 26-27 WAVE2 promo
    variants:
      - { suffix: "(Super Alternate Art)",      code: "SAA" }
      - { suffix: "(Bonus Pack Alternate Art)", code: "BPAA" }   # starter-deck bonus pack parallels
      - { suffix: "(Limited Pack",              code: "LP" }     # 'Limited Pack 26-27 WAVE2' promos listed inside sets
      - { suffix: "(1st Anniversary Set)",      code: "ANN" }    # reprint parallels with the starter-deck number (FS03-16)
      - { suffix: "(Alternate Art)",            code: "AA" }
      - { suffix: "(Gold)",                code: "GOLD" }
      - { suffix: "(Dragon Ball Pattern)", code: "DBP" }

  dbs:
    name: "Dragon Ball Super Card Game (Masters)"
    short: "Masters"
    tcgcsv_category: 27              # TCGplayer 'Dragon Ball Super CCG' — the original line, BT sets (Masters era from BT23)
    cardtrader_game: "dragon ball"
    cardmarket_game_id: 13
    cardmarket_slug: DragonBallSuper
    enabled: true
    score: true
    eu_sources: true
    alerts: false                    # silent first month: page + paper portfolio build evidence; flip after the first monthly review
    # Variants that do not come out of a regular booster box (Collector Booster parallels, serial-numbered): tracked as cards,
    # never a hit in the box EV. BT24 showed EV €545 because one serial-numbered 'SR' (Cardmarket sales ~€1,550) counted as a box pull.
    box_excluded_variants: [CB, CBG, CBS, SN, GOLDSTAMP, SILVER]   # + Collector's Selection gold-stamped / silver parallels
    cardmarket_box_buy: false        # Masters box pages mix EN/FR/JP listings and the public price guide has no language split:
                                     # Cardmarket is a comparison line here, never the buy price (CardTrader/eBay/retail are EN-filtered)
    ebay_sets: 8
    group_kinds:
      booster: '^BT\d{2}$'
      starter: '^(SD|BE|EB|DBS-BE)\d{2}|^EB'
      promo:   '_PR$|^(TPR|JPR|PR|P)$|Promo|Release|Pre-Release'
    box:
      packs: 24
      cards_per_pack: 12
      case_boxes: 12
    set_overrides: {}
    sealed:
      box:  { endswith: "Booster Box", not_contains: ["Case"] }
      case: { endswith: "Booster Box Case" }
      pack: { endswith: "Booster Pack", not_contains: ["Sleeved"] }
    # Masters hit classes (BT28–BT31 structure: 15 SPR, 10 SLR, 2–3 SCR, 2–3 GDR, 5–7 Concept Rare per set).
    # est = expected per 24-pack box. No published rates; conservative reading of community openings: SPR ~2/box,
    # SLR ~1/box, SCR ~1 per 3 boxes, Concept Rare ~1 per 2 boxes, GDR ~1 per case. Deliberately on the low side — with the
    # generous reading (SPR 4, SLR 2, SCR 0.5) every recent set scores a US-ratio of 1.4–2.9, which the market would not
    # leave on the table. Low confidence until the paper portfolio says otherwise.
    classes:
      - id: GDR
        label: "God Rare (★★)"
        rule: { rarity: "God Rare" }
        est: 0.08
        lottery: true                 # like Fusion World ★★: ~1 per case, reported separately, not in the buy ratio
        note: "~1 per 12-box case"
      - id: SCR
        label: "Secret Rare"
        rule: { rarity: "Secret Rare" }
        est: 0.33
        note: "~1 per 3 boxes"
      - id: SLR
        label: "Special Leader Rare"
        rule: { rarity: "Special Leader Rare" }
        est: 1.0
        note: "~1 per box"
      - id: SPR
        label: "Special Rare"
        rule: { rarity: "Special Rare" }
        est: 2.0
        note: "~1 per 12 packs"
      - id: CR
        label: "Concept Rare"
        rule: { rarity: "Concept Rare" }
        est: 0.5
        note: "rate unknown; assumption"
      - id: SR
        label: "Super Rare"
        rule: { rarity: "Super Rare" }
        est: 6.0
    variants:                               # Masters parallels share the base card's number; the name suffix is the variant
      - { suffix: "(GDR)", code: "GDR" }      # God Rare
      - { suffix: "(SCR)", code: "SCR" }      # Secret Rare version of a numbered card
      - { suffix: "(SLR)", code: "SLR" }
      - { suffix: "(SPR)", code: "SPR" }
      - { suffix: "(Silver", code: "SILVER" }
      - { suffix: "(Gold-Stamped", code: "GOLDSTAMP" }
      - { suffix: "(Gold Stamped", code: "GOLDSTAMP" }
      - { suffix: "(God Rare)", code: "GDR" }
      - { suffix: "(Collector Booster Silver", code: "CBS" }
      - { suffix: "(Collector Booster Gold", code: "CBG" }
      - { suffix: "(Collector Booster", code: "CB" }
      - { suffix: "(Serial Numbered)", code: "SN" }
      - { suffix: "(Non-Foil", code: "NF" }
      - { suffix: "(Foil", code: "F" }
      - { suffix: "(Metallic Foil", code: "MF" }
      - { suffix: "(Alternate Art", code: "AA" }
      - { suffix: "(Parallel", code: "P" }
    number_fixes:
      580827: "BT26-127"     # 'Trunks, Escape' carries BT26-126 in the source (2026-10), clashing with Golden Cooler

  riftbound:
    name: "Riftbound: League of Legends Trading Card Game"
    short: "Riftbound"
    tcgcsv_category: 89
    enabled: true
    score: true
    eu_sources: true
    alerts: true                     # KOOP / SLAB messages on (owner's call, 2026-10-23)
    paper: false                     # not part of the paper-portfolio test
    ebay_sets: 6
    cardtrader_game: "riftbound"     # CardTrader game 22 'Riftbound | League of Legends'
    cardtrader_expansions: '^(ogn|sfd|unl|ven|rad|lgc|rec|ogs|pg\d)$'    # by CardTrader expansion code (probe 2026-10-23)
    cardmarket_game_id: 22
    cardmarket_slug: Riftbound
    group_kinds:
      booster: '^(?!OGS$|PG\d$|JDG$|SGN$|OPP$|RWB$)[A-Z]{3}$'   # OGN SFD UNL VEN RAD LGC … (3 letters, not a starter/promo code)
      starter: '^(OGS|PG\d)$'        # Proving Grounds
      promo:   '^(OPP|JDG|SGN|PR|RWB|GRFT|T1)|Promo|Bundle|Worlds'
    box:
      packs: 24
      cards_per_pack: 14
      case_boxes: 4                  # 'Booster Display Case' — assumption, check against the case price
    set_overrides: {}
    sealed:                          # TCGplayer calls the box a 'Booster Display'
      box:  { endswith: "Booster Display", not_contains: ["Case"] }
      case: { endswith: "Booster Display Case" }
      pack: { endswith: "Booster Pack", not_contains: ["Sleeved"] }
    # Hit classes. TCGplayer rarity 'Showcase' is the whole chase layer; the name suffix tells which kind.
    # est = expected per 24-pack box. Sources: riftbound.gg (Origins), tcgtalk.com Unleashed/Vendetta openings (2026) —
    # Epic ~1 in 4 packs, Alternate Art ~2–3 per box, Overnumbered ~1 per 2–3 boxes, Signature ~1 in 10 Overnumbered,
    # Ultimate (from Unleashed) rarer still. Low confidence until the first boxes are opened.
    classes:
      - id: SIG
        label: "Signature (★)"
        rule: { rarity: "Showcase", name_contains: "Signature" }
        est: 0.08
        lottery: true
        note: "signed Overnumbered, ~1 per 12 boxes"
      - id: ULT
        label: "Ultimate"
        rule: { rarity: "Showcase", name_contains: "(Ultimate)" }
        est: 0.05
        lottery: true
        note: "set chase (Baron Nashor UNL); rate unknown"
      - id: "ON"                     # quoted: bare ON is a YAML boolean
        label: "Overnumbered"
        rule: { rarity: "Showcase", name_contains: "Overnumbered" }
        est: 0.4
        note: "~1 per 2–3 boxes"
      - id: AA
        label: "Alternate Art"
        rule: { rarity: "Showcase", name_contains: "(Alternate Art)" }
        est: 2.5
        note: "~2–3 per box"
      - id: SPC
        label: "Showcase (overig)"
        rule: { rarity: "Showcase" }
        est: 0.3
        note: "special showcase cards (SP numbers, Crystal Rose); rate unknown"
      - id: EPIC
        label: "Epic"
        rule: { rarity: "Epic" }
        est: 6.5
        note: "~1 in 4 packs"
      - id: RARE
        label: "Rare"
        rule: { rarity: "Rare" }
        est: 42
        note: "2 rare-or-better slots per pack minus the Epics"
    box_excluded_variants: [SN, PW, BO, CH, T8]      # serial-numbered and organized-play prizes never come out of a box
    variants:
      - { suffix: "(Heartsteel Signature)",   code: "SIG" }
      - { suffix: "(Heartsteel Overnumbered)", code: "ON" }
      - { suffix: "(Signature)",              code: "SIG" }
      - { suffix: "(Overnumbered)",           code: "ON" }
      - { suffix: "(Alternate Art)",          code: "AA" }
      - { suffix: "(Ultimate)",               code: "ULT" }
      - { suffix: "(Serial Numbered)",        code: "SN" }
      - { suffix: "(Prize Wall)",             code: "PW" }
      - { suffix: "(Best Of)",                code: "BO" }
      - { suffix: "(Champion)",               code: "CH" }
      - { suffix: "(Top 8)",                  code: "T8" }

  naruto:
    name: "NARUTO CARD GAME"
    short: "Naruto"
    tcgcsv_category: 93
    enabled: true
    score: false                     # watch-only until the first set exists (worldwide launch June 2027)
    eu_sources: false
    alerts: true
    group_kinds:
      booster: '^[A-Z]{2}\d{2}$'
      starter: '^ST\d{2}$'
      promo:   '^PR|_PR$|Promo'      # anchored: an abbreviation like 'SPR01' must not read as promo
    box: { packs: 24, cards_per_pack: 12, case_boxes: 12 }
    sealed:
      box:  { endswith: "Booster Box", not_contains: ["Case"] }
      case: { endswith: "Booster Box Case" }
      pack: { endswith: "Booster Pack", not_contains: ["Sleeved"] }
    classes: []
    variants: []
