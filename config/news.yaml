# Official publisher pages watched for product/set announcements (the earliest signal, before shops list anything).
# Each source: a list page, a regex that yields (url, date, title) per item, and which titles are worth a message.
# Everything found is stored in data/news/<day>.json; only `product`-matching titles become 📰 messages.
sources:
  - id: dbfw_news
    game: dbfw
    name: "Fusion World official news"
    url: https://www.dbs-cardgame.com/fw/en/news.html
    base: https://www.dbs-cardgame.com
    item: '<li class="newsItem">.*?<a href="([^"]+)"[^>]*class="newsLink".*?<time class="newsDate" datetime="([^"]+)">.*?<h3 class="newsText">(.*?)</h3>'
  - id: dbfw_products
    game: dbfw
    name: "Fusion World official product list"
    url: https://www.dbs-cardgame.com/fw/en/products/
    base: https://www.dbs-cardgame.com
    item: '<a href="(https://www\.dbs-cardgame\.com/fw/en/products/\d+_\d+\.html)"[^>]*>(?:(?!</a>).)*?(?P<title>(?:BOOSTER|STARTER|MANGA|STORY|PREMIUM|OFFICIAL|ULTIMATE|SPECIAL|COLLECTION|SET|BOX)[^<"]{3,120})'
    order: [url, title]
    kind: product                       # every new entry on the product list is an announcement
  - id: naruto_news
    game: naruto
    name: "NARUTO CARD GAME official news"
    url: https://www.naruto-cardgame.com/en/news/article-list.php
    base: https://www.naruto-cardgame.com
    item: '<li class="newsListItem card">.*?<a class="cardBox" href="([^"]+)">.*?<dt class="cardTitle">(.*?)</dt>.*?<time class="date" datetime="([^"]+)">'
    order: [url, title, date]
    kind: all                           # pre-launch: every official Naruto item is news (events, reveals, lineup)
  - id: dbs_updates
    game: dbs
    name: "Masters official site updates"
    url: https://www.dbs-cardgame.com/us-en/
    base: https://www.dbs-cardgame.com
    parser: anchors                     # 'Website Updates' list: date (2026/10/30) + link; product/set titles filtered by `product`
    path_prefix: /us-en/
  - id: dbs_products
    game: dbs
    name: "Masters official product list"
    url: https://www.dbs-cardgame.com/us-en/product/
    base: https://www.dbs-cardgame.com/us-en/product/      # links are relative (dbs-b32.php) — base is the folder
    item: '<a href="((?:https://www\.dbs-cardgame\.com/us-en/product/|\./|/us-en/product/)?dbs-[a-z0-9_-]+\.php)"'
    order: [url]                        # title = slug (dbs-b32) when the page gives none
    kind: product
  - id: riftbound_news
    game: riftbound
    name: "Riftbound official news"
    url: https://playriftbound.com/en-us/news/announcements    # moved from riftbound.leagueoflegends.com (Oct 2026)
    base: https://playriftbound.com
    parser: anchors                     # server-rendered cards: <a href><time>ISO</time><h3>title</h3></a>
    path_prefix: /en-us/news/
    kind: all

# Titles that mean "a product you can (pre-)order": these become messages. Case-insensitive.
# Socials: YouTube is the one channel with a stable feed (no API key). `url` is the channel page; the channel id is read
# from it. X/Instagram/TikTok have no open feed — not watched. Fill in the handles and set enabled: true.
  - id: yt_riftbound
    game: riftbound
    name: "Riftbound YouTube"
    url: https://www.youtube.com/@Riftbound
    base: https://www.youtube.com
    parser: youtube
    kind: all
    enabled: false                      # handle unverified — set true once checked
  - id: yt_dbs
    game: dbfw
    name: "Dragon Ball Super Card Game YouTube"
    url: https://www.youtube.com/@dragonballsupercardgame
    base: https://www.youtube.com
    parser: youtube
    enabled: false                      # handle unverified — set true once checked
product: '(booster|starter|deck|pre-?order|release|launch|product|collection|set\b|box|pack|edition|lineup|available|on sale|retailer)'
# Noise never sent (stored only): the digital app's own notices.
stale_days: 45                    # a source whose newest item is older than this is reported as broken (weekly ⚠️)
max_age_days: 14                  # alert only on items younger than this (a repaired source must not replay old news)
ignore: '(\[DIGITAL ver\.\]|serial code|app update|maintenance)'
