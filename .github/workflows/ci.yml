name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["data/**", "site/data/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Build from committed data (no network)
        run: |
          python -m tcgwatcher validate --day "$(python -c "import json;print(json.load(open('data/state/sync.json'))['day'])")"
          python -m tcgwatcher build --day "$(python -c "import json;print(json.load(open('data/state/sync.json'))['day'])")"
