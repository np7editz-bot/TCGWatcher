name: retail

on:
  schedule:
    - cron: "15 */2 * * *"     # every 2 hours; ~40 lightweight requests per run
  workflow_dispatch:

concurrency:
  group: daily              # never overlap with the daily pipeline (both commit data)
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Retailer monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m tcgwatcher retail
          python -m tcgwatcher build
      - name: Commit data
        run: |
          git config user.name "tcgwatcher-bot"
          git config user.email "tcgwatcher-bot@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "retail: $(date -u +%Y-%m-%dT%H:%MZ) observations"
            git pull --rebase origin main && git push
          fi
