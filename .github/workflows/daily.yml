name: daily

on:
  schedule:
    - cron: "30 21 * * *"      # 21:30 UTC daily; tcgcsv.com publishes around 20:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch even if the source did not change"
        type: boolean
        default: false

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Fetch → validate → build → alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          python -m tcgwatcher all ${{ inputs.force && '--force' || '' }}

      - name: Commit data
        run: |
          git config user.name "tcgwatcher-bot"
          git config user.email "tcgwatcher-bot@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            day=$(python -c "import json;print(json.load(open('data/state/sync.json'))['day'])")
            git commit -m "data: ${day} snapshot"
            git pull --rebase origin main
            git push
          fi

      # Hosting of site/ is optional. GitHub Pages needs a public repo (or a paid plan); set the repository
      # variable DEPLOY_PAGES=true once Pages is enabled with source "GitHub Actions". Any other static host
      # (Cloudflare Pages, Netlify) can deploy the site/ folder straight from the repo instead.
      - name: Upload site
        if: vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: vars.DEPLOY_PAGES == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
